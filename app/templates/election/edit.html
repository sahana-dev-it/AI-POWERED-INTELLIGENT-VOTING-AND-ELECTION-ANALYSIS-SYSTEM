<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Election</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="form-page">


<div class="form-container">


    <!-- ==============================
         HEADER
    =============================== -->

    <div class="form-header">

        <div>

            <span class="form-label">
                ELECTION MANAGEMENT
            </span>

            <h1>
                Edit Election
            </h1>

            <p>
                Update the election details, schedule and status.
            </p>

        </div>


        <a
            href="/election/list"
            class="form-back-button"
        >
            ← Back to Elections
        </a>

    </div>



    <!-- ==============================
         FORM CARD
    =============================== -->

    <div class="form-card">


        <form method="POST">


            <!-- Election Title -->

            <div class="form-group">

                <label for="title">
                    Election Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ election.title }}"
                    required
                >

            </div>



            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    required
                >{{ election.description }}</textarea>

            </div>



            <!-- Date and Time -->

            <div class="form-row">


                <div class="form-group">

                    <label for="start_date">
                        Start Date
                    </label>

                    <input
                        type="date"
                        id="start_date"
                        name="start_date"
                        value="{{ election.start_date }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="start_time">
                        Start Time
                    </label>

                    <input
                        type="time"
                        id="start_time"
                        name="start_time"
                        value="{{ election.start_time }}"
                        required
                    >

                </div>


            </div>



            <div class="form-row">


                <div class="form-group">

                    <label for="end_date">
                        End Date
                    </label>

                    <input
                        type="date"
                        id="end_date"
                        name="end_date"
                        value="{{ election.end_date }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="end_time">
                        End Time
                    </label>

                    <input
                        type="time"
                        id="end_time"
                        name="end_time"
                        value="{{ election.end_time }}"
                        required
                    >

                </div>


            </div>



            <!-- Status -->

            <div class="form-group">

                <label for="status">
                    Election Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option
                        value="Upcoming"
                        {% if election.status == "Upcoming" %}
                            selected
                        {% endif %}
                    >
                        Upcoming
                    </option>


                    <option
                        value="Active"
                        {% if election.status == "Active" %}
                            selected
                        {% endif %}
                    >
                        Active
                    </option>


                    <option
                        value="Completed"
                        {% if election.status == "Completed" %}
                            selected
                        {% endif %}
                    >
                        Completed
                    </option>

                </select>

            </div>



            <!-- Actions -->

            <div class="form-actions">


                <a
                    href="/election/list"
                    class="form-cancel-button"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="form-submit-button"
                >
                    Update Election
                </button>


            </div>


        </form>


    </div>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="form-footer">

        <p>
            AI-Powered Intelligent Voting & Election Analysis System
        </p>

    </footer>


</div>


</body>

</html>
