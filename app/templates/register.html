<!-- Tells the browser that this is an HTML5 document -->
<!DOCTYPE html>

<html lang="en">

<head>
    <!-- Supports characters from different languages -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>Register - Voting System</title>
</head>

<body>

    <!-- Main heading of the registration page -->
    <h1>Create Your Account</h1>
    {% if message %}
    <h3>{{ message }}</h3>
    {% endif %}
    <!--
        This form sends user data to the /register URL.
        method="POST" is used because we are sending data to the server.
    -->
    <form method="POST">

        <!-- Full name input -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <!-- Email input -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <!-- Password input -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <!-- Register button -->
        <button type="submit">Register</button>

    </form>

</body>

</html>
