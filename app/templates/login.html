<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">


<div class="auth-container">


    <!-- =====================================
         LEFT SIDE
    ====================================== -->

    <div class="auth-info">

        <div class="auth-info-content">

            <p class="auth-label">
                SECURE ELECTION PLATFORM
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="auth-description">
                Access your voting account and continue
                securely to the election platform.
            </p>


            <div class="auth-features">

                <div class="auth-feature">
                    <span></span>
                    Secure user authentication
                </div>

                <div class="auth-feature">
                    <span></span>
                    Role-based access control
                </div>

                <div class="auth-feature">
                    <span></span>
                    Protected online voting
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================
         RIGHT SIDE
    ====================================== -->

    <div class="auth-form-container">

        <div class="auth-form">

            <h2>
                Login
            </h2>

            <p class="form-subtitle">
                Sign in to continue to your dashboard.
            </p>


            <form
                method="POST"
                action="{{ url_for('auth.login') }}"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login to Dashboard
                </button>


            </form>


            <!-- REGISTER LINK -->

            <p class="auth-switch">

                Don't have an account?

                <a href="{{ url_for('auth.register') }}">
                    Create an account
                </a>

            </p>


        </div>

    </div>


</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".password-toggle");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        password.type = "password";

        button.textContent = "👁";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}

</script>


</body>

</html>
