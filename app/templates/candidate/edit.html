<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Candidate</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }


        body{

            background:linear-gradient(
                135deg,
                #eef7f4,
                #dfeee9
            );

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;

        }


        .container{

            width:100%;

            max-width:900px;

            background:white;

            border-radius:22px;

            padding:40px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.12);

        }


        h1{

            color:#146b5f;

            margin-bottom:10px;

            font-size:34px;

        }


        .subtitle{

            color:#666;

            margin-bottom:35px;

        }


        form{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:25px;

        }


        .full{

            grid-column:1/3;

        }


        label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#23534d;

        }


        input,
        select,
        textarea{

            width:100%;

            padding:14px;

            border:1px solid #d5e1dd;

            border-radius:10px;

            font-size:15px;

            outline:none;

            transition:.3s;

        }


        input:focus,
        select:focus,
        textarea:focus{

            border-color:#147869;

            box-shadow:
                0 0 0 4px rgba(
                    20,
                    120,
                    105,
                    .15
                );

        }


        textarea{

            resize:vertical;

            min-height:130px;

        }


        /* =========================
           POSITION BOX
        ========================= */

        .position-box{

            grid-column:1/3;

            background:#f4faf8;

            border:1px solid #d5e8e2;

            border-radius:12px;

            padding:18px;

        }


        .position-box label{

            margin-bottom:8px;

        }


        .position-help{

            margin-top:7px;

            font-size:13px;

            color:#6b7b77;

        }


        .buttons{

            grid-column:1/3;

            display:flex;

            justify-content:space-between;

            margin-top:15px;

        }


        .back{

            text-decoration:none;

            background:#888;

            color:white;

            padding:14px 22px;

            border-radius:10px;

            font-weight:bold;

        }


        .back:hover{

            background:#666;

        }


        .update{

            background:#147869;

            color:white;

            border:none;

            padding:14px 30px;

            border-radius:10px;

            cursor:pointer;

            font-size:16px;

            font-weight:bold;

            transition:.3s;

        }


        .update:hover{

            background:#0f6255;

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:768px){

            form{

                grid-template-columns:1fr;

            }


            .full{

                grid-column:1;

            }


            .position-box{

                grid-column:1;

            }


            .buttons{

                grid-column:1;

                flex-direction:column;

                gap:15px;

            }


            .back,
            .update{

                width:100%;

                text-align:center;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================
         PAGE TITLE
    ================================== -->

    <h1>
        Edit Candidate
    </h1>


    <p class="subtitle">
        Update candidate details for the selected election.
    </p>



    <!-- =================================
         EDIT FORM
    ================================== -->

    <form method="POST">


        <!-- =================================
             ELECTION
        ================================== -->

        <div class="full">

            <label>
                Select Election
            </label>


            <select
                name="election_id"
                id="election_id"
                required
            >

                {% for election in elections %}

                <option
                    value="{{ election.id }}"
                    data-type="{{ election.election_type }}"
                    {% if election.id == candidate.election_id %}
                    selected
                    {% endif %}
                >

                    {{ election.title }}

                </option>

                {% endfor %}

            </select>

        </div>



        <!-- =================================
             POSITION
             ONLY FOR MULTIPLE-POSITION
             ELECTIONS
        ================================== -->

        <div
            class="position-box"
            id="positionBox"
            style="display:none;"
        >

            <label>
                Candidate Position
            </label>


            <input
                type="text"
                name="position"
                id="position"
                value="{{ candidate.position or '' }}"
                placeholder="Example: President, Secretary, Treasurer"
            >


            <div class="position-help">

                This field is required only for
                multiple-position elections.

            </div>

        </div>



        <!-- =================================
             CANDIDATE NAME
        ================================== -->

        <div>

            <label>
                Candidate Name
            </label>


            <input
                type="text"
                name="name"
                value="{{ candidate.name }}"
                required
            >

        </div>



        <!-- =================================
             AGE
        ================================== -->

        <div>

            <label>
                Age
            </label>


            <input
                type="number"
                name="age"
                min="18"
                max="100"
                value="{{ candidate.age }}"
                required
            >

        </div>



        <!-- =================================
             GENDER
        ================================== -->

        <div>

            <label>
                Gender
            </label>


            <select
                name="gender"
            >

                <option
                    value="Male"
                    {% if candidate.gender == "Male" %}
                    selected
                    {% endif %}
                >
                    Male
                </option>


                <option
                    value="Female"
                    {% if candidate.gender == "Female" %}
                    selected
                    {% endif %}
                >
                    Female
                </option>


                <option
                    value="Other"
                    {% if candidate.gender == "Other" %}
                    selected
                    {% endif %}
                >
                    Other
                </option>

            </select>

        </div>



        <!-- =================================
             PARTY
        ================================== -->

        <div>

            <label>
                Party Name
            </label>


            <input
                type="text"
                name="party"
                value="{{ candidate.party }}"
                required
            >

        </div>



        <!-- =================================
             EDUCATION
        ================================== -->

        <div>

            <label>
                Education
            </label>


            <input
                type="text"
                name="education"
                value="{{ candidate.education }}"
                required
            >

        </div>



        <!-- =================================
             PROFESSION
        ================================== -->

        <div>

            <label>
                Profession
            </label>


            <input
                type="text"
                name="profession"
                value="{{ candidate.profession }}"
                required
            >

        </div>



        <!-- =================================
             MANIFESTO
        ================================== -->

        <div class="full">

            <label>
                Manifesto
            </label>


            <textarea
                name="manifesto"
                required
            >{{ candidate.manifesto }}</textarea>

        </div>



        <!-- =================================
             BUTTONS
        ================================== -->

        <div class="buttons">


            <a
                href="/candidate/list?election_id={{ candidate.election_id }}"
                class="back"
            >
                ← Back
            </a>


            <button
                type="submit"
                class="update"
            >
                Update Candidate
            </button>


        </div>


    </form>

</div>



<!-- =================================
     POSITION SHOW/HIDE SCRIPT
================================== -->

<script>

    function updatePositionField() {

        const electionSelect =
            document.getElementById("election_id");

        const positionBox =
            document.getElementById("positionBox");

        const positionInput =
            document.getElementById("position");


        if (!electionSelect.value) {

            positionBox.style.display = "none";

            positionInput.required = false;

            return;

        }


        const selectedOption =
            electionSelect.options[
                electionSelect.selectedIndex
            ];


        const electionType =
            selectedOption.getAttribute(
                "data-type"
            );


        if (electionType === "multiple") {

            /*
             * Multiple-position election
             * Show Position field
             */

            positionBox.style.display = "block";

            positionInput.required = true;

        }

        else {

            /*
             * Single-position election
             * Hide Position field
             */

            positionBox.style.display = "none";

            positionInput.required = false;

        }

    }


    /*
     * Run when page first loads
     */

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            updatePositionField();

        }
    );


    /*
     * Run whenever admin changes
     * the election
     */

    document.getElementById(
        "election_id"
    ).addEventListener(
        "change",
        function(){

            updatePositionField();

        }
    );

</script>


</body>

</html>
