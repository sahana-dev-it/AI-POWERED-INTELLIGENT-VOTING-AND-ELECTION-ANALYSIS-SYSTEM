<!DOCTYPE html>
<html>

<head>

    <title>Email Verified</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .success-container {
            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        .success-icon {
            font-size: 55px;

            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;

            line-height: 1.5;
        }

        .login-button {
            display: inline-block;

            margin-top: 20px;

            padding: 13px 30px;

            background: #4a90e2;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 16px;
        }

        .login-button:hover {
            background: #357abd;
        }

    </style>

</head>


<body>


<div class="success-container">


    <div class="success-icon">
        ✅
    </div>


    <h1>
        Email Verified!
    </h1>


    <p>
        Your email has been successfully verified.
    </p>


    <p>
        Your voter account is now active.
        You can login and participate in elections.
    </p>


    <a
        href="/login"
        class="login-button"
    >
        Continue to Login
    </a>


</div>


</body>

</html>
